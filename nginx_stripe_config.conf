# Configuração do Nginx para proxy reverso do Stripe
# Adicionar este bloco ao arquivo de configuração do nginx para app.handsplay.com.br

location /stripe {
    # Proxy para o backend Stripe na porta 4242
    proxy_pass http://localhost:4242;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Headers para webhooks do Stripe
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    
    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
}

# Configuração adicional para webhooks (se necessário)
location /stripe/webhook {
    proxy_pass http://localhost:4242/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Headers específicos para webhooks
    proxy_set_header Content-Type application/json;
    proxy_set_header User-Agent "Stripe-Webhook";
}
